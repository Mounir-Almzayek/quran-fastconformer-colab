# Independent FastConformer Quran ASR experiment for a single Colab GPU.
# Primary research experiment: the punctuation-only FastConformer PC checkpoint.
# It has no EveryAyah declaration in its public model card. The prior PCD setup
# remains available in configs/fastconformer_quran_pcd_legacy.yaml.
project:
  name: quran-fastconformer-pc-independent
  seed: 2419
  artifacts_dir: artifacts/experiments/fastconformer_pc
  # WAV files are intentionally kept on Colab local disk; Drive stores durable manifests, checkpoints, models, and reports.
  runtime_audio_dir: /content/quran-fastconformer-audio

dataset:
  name: tarteel-ai/everyayah
  config: default
  source_split: train
  streaming: true
  target_sampling_rate: 16000
  min_duration_seconds: 0.3
  max_duration_seconds: 25.0
  # Small bounded shuffle buffer keeps Colab RAM stable while source audio is streamed.
  shuffle_buffer: 1024
  candidate_pool_size: 30000
  # Maximum materialized clips. Audio is downloaded only for these selected rows
  # because NeMo manifests need local WAV files; the rest of EveryAyah stays remote.
  sample_caps:
    train: 8000
    validation: 1000
    test: 1000
  reciter_split:
    strategy: disjoint_reciters
    minimum_samples_per_holdout_reciter: 1000
    validation_reciters: 1
    test_reciters: 1

text:
  # The PC tokenizer/output is non-diacritized. Training labels remove diacritics
  # while evaluation preserves both canonical surface and lexical protocols.
  target_normalization: quranic_light
  primary_normalization: canonical
  diagnostic_normalization: quranic_light

model:
  pretrained_name: nvidia/stt_ar_fastconformer_hybrid_large_pc_v1.0
  decoder: ctc
  sample_rate: 16000

training:
  work_dir: artifacts/experiments/fastconformer_pc/nemo
  final_model_path: artifacts/experiments/fastconformer_pc/models/fastconformer-quran-pc.nemo
  batch_size: 4
  validation_batch_size: 4
  # Single-process audio loading is slower but prevents worker queues from
  # exhausting the 12.7 GB RAM commonly available in free Colab runtimes.
  num_workers: 0
  pin_memory: false
  # Save full Lightning recovery state to Drive every 500 optimizer steps.
  # Re-running the same command resumes this stage automatically from last.ckpt.
  checkpoint_every_n_train_steps: 500
  # Print one concise progress line every 100 steps instead of verbose
  # per-sample RNNT predictions emitted by the pretrained hybrid model.
  progress_every_n_train_steps: 100
  precision: 16-mixed
  gradient_clip_val: 1.0
  # Conservative, progressive adaptation: begin with the top encoder layers plus
  # CTC decoder, then expand training while lowering the learning rate.
  stages:
    - name: top_encoder_and_ctc
      encoder_layers: top_3
      max_epochs: 1
      learning_rate: 5.0e-5
    - name: upper_encoder_and_ctc
      encoder_layers: upper_half
      max_epochs: 1
      learning_rate: 2.0e-5
    - name: full_model
      encoder_layers: all
      max_epochs: 2
      learning_rate: 1.0e-5

reporting:
  baseline_metrics_file: artifacts/experiments/fastconformer_pc/results/baseline/metrics.json
  finetuned_metrics_file: artifacts/experiments/fastconformer_pc/results/finetuned/metrics.json
  comparison_dir: artifacts/experiments/fastconformer_pc/results/comparison
  representative_examples: 12
  duration_bins_seconds:
    - label: short_0_to_10
      lower: 0.0
      upper: 10.0
    - label: medium_10_to_20
      lower: 10.0
      upper: 20.0
    - label: long_20_to_25
      lower: 20.0
      upper: 25.000001
  minimum_group_examples: 5
